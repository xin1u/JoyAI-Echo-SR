name: Static checks

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight validation dependency
        run: python -m pip install pyyaml
      - name: Compile Python sources
        run: python -m compileall -q packages tools
      - name: Validate Shell scripts
        run: |
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find scripts packages/ltx-sr-trainer/scripts -type f -name '*.sh' | sort)
      - name: Parse public configs and examples
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import yaml

          configs = {}
          for path in Path("configs").rglob("*.yaml"):
              with path.open(encoding="utf-8") as handle:
                  config = yaml.safe_load(handle)
                  assert isinstance(config, dict), path
                  configs[path] = config
          for path, config in configs.items():
              if path.name.startswith("echo_sr_"):
                  assert config["dmd"]["enabled"] is True, path
                  assert "train_data_files" in config["data"], path
                  assert "pair_data_root" not in config["data"], path
          for path in Path("examples").glob("*.json"):
              with path.open(encoding="utf-8") as handle:
                  assert isinstance(json.load(handle), dict), path
          PY
