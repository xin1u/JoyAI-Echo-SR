[project]
name = "echo-av-distill"
version = "0.1.0"
description = "Echo-SR 1-step distillation for LTX-2.3 long-video audio-video super-resolution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.2.1",
    "av>=14.2.1",
    "einops",
    "opencv-python>=4.11.0.86",
    "peft>=0.14.0",
    "pydantic>=2.10.4",
    "pyyaml>=6.0",
    "safetensors>=0.5.0",
    "torch>=2.7.0",
    "torchaudio>=2.7.0",
    "torchvision>=0.21.0",
    "tqdm",
    "transformers>=4.49.0",
]

[project.optional-dependencies]
tracking = ["swanlab"]
perceptual = ["lpips"]
fast-decode = ["decord"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/echo_sr"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
